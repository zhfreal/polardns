# Comprehensive chinadns-rs TOML Configuration File
# Run with: chinadns-rs --config /etc/chinadns-rs/config.toml

# ==============================================================================
# 1. CORE & LISTENER SETTINGS
# ==============================================================================
# Workspace base directory for resolving relative paths (e.g. for rules, certificates, databases).
# Can also be set via CHINADNS_WORKSPACE env variable or -w / --workspace CLI flag.
workspace = "/etc/chinadns-rs"

# Custom User-Agent header string for HTTP requests (DoH, DoH3, Web rules)
# user_agent = "chinadns-rs/1.17.0"

# Global Adblock Array (Evaluated highest priority, runs before rules)
# List of adblock lists that are always prioritized first (corresponds to --adblock)
# Can contain local paths, or structured web rule entries for periodic fetching.
adblock = [
    "/etc/chinadns-rs/adblock-base.list",
    # { path = "rules/adblock-remote.txt", url = "https://easylist.to/easylist/easylist.txt", refresh = 86400 }
]


# Filter IPv6 rules globally for all groups (equivalent to --no-ipv6).
# Can be a boolean `true` or a comma-separated list of tags (e.g. "direct,proxy").
# no_ipv6 = "direct,proxy"

# Filter specific DNS query types (e.g. 28 for AAAA, 65 for HTTPS) globally for all queries.
# filter_qtype = [65]

[listeners]
# Listener IP addresses or Unix Domain Sockets (stream: unix:/path, datagram: unixgram:/path)
bind_addr = ["127.0.0.1", "::1"]

# Standard DNS (UDP/TCP) listener ports
bind_port = [1054]

# Specific listener endpoints (address:port pairs or Unix sockets, bypassing cross-multiplication)
# listen = ["127.0.0.1:1053", "[::1]:1053", "unix:/tmp/dns.sock", "unixgram:/tmp/dns.sock"]
listen = []

# Bind to specific network interfaces (e.g. ["lo", "eth0"])
interface = []

# Exclude specific network interfaces (e.g. ["wlan*", "eth1"])
# (CLI equivalent: --except-interface)
except_interface = []

# Statically bind to interfaces using SO_BINDTODEVICE
# (CLI equivalent: -z / --bind-interfaces)
bind_interfaces = false

# Dynamically bind individual sockets to interface IPs (dnsmasq style)
# (CLI equivalents: --bind-dynamic, --bind)
bind_dynamic = false

# Disable binding to IPv6 Link-Local (fe80::/10) addresses globally
# no_ipv6_link_local = false

# Listen on UDP only (disables local TCP listener)
udp_only = false

# ==============================================================================
# 2. LOCAL DoT / DoH / DoH3 LISTENER SETTINGS
# ==============================================================================
[listeners.tls]
# Bind TLS listeners to specific network interfaces (independent of plain DNS)
# interface = []

# Exclude specific network interfaces for TLS listeners
# (CLI equivalent: --tls-except-interface)
# except_interface = []

# Statically bind TLS listeners to interfaces using SO_BINDTODEVICE
# (CLI equivalent: --tls-bind-interfaces)
# bind_interfaces = false

# Dynamically bind TLS individual sockets to interface IPs
# (CLI equivalents: --tls-bind-dynamic, --tls-bind)
# bind_dynamic = false

# Bind TLS listeners to specific addresses (independent of plain DNS)
# bind_addr = []

# Disable binding to IPv6 Link-Local (fe80::/10) addresses for TLS listeners
# no_ipv6_link_local = false

# Enable DNS-over-TLS (DoT) listener
enable_dot = false
dot_port = [853]

# Enable DNS-over-HTTPS (DoH) listener
enable_doh = false
doh_port = [443]
doh_path = "/dns-query"

# Enable DNS-over-HTTP/3 (DoH3 over QUIC). Requires enable_doh = true.
enable_doh3 = false

# Enable DNS-over-QUIC (DoQ) listener (RFC 9250)
enable_doq = false
doq_port = [853]

# Idle timeout for QUIC (DoH3 and DoQ) connections in milliseconds (default: 30000ms / 30s)
quic_idle_timeout_ms = 30000

# Default TLS certificate chain and private key (PEM format)
cert_file = "/etc/chinadns-rs/tls/default.crt"
key_file = "/etc/chinadns-rs/tls/default.key"

# Additional TLS certificate/key pairs for SNI matching
# Supports single combined cert files (where key is omitted)
cert_pairs = [
    # { cert = "/etc/chinadns-rs/tls/cert1.pem", key = "/etc/chinadns-rs/tls/key1.pem" }
    # { cert = "/etc/chinadns-rs/tls/combined.pem" }
]

# Reject local TLS handshakes without a matching DNS SNI name
strict_sni = false

# Allow TLS 1.2 for local DoT/DoH TCP listeners (TLS 1.3 is default). Requires build feature `tls12`.
enable_tls12 = false

# ==============================================================================
# 3. UPSTREAM DNS CONFIGURATION & ROUTING TARGET SETS
# ==============================================================================
# All upstream server URLs (direct, proxy, fallback, groups) support per-upstream attributes:
#   - `|ca=/path/to/ca.pem` (custom root CA certificate for verification)
#   - `|mark=100`           (socket mark for outbound routing, Linux only)
# Attributes can be combined: `tls://1.1.1.1:853|ca=/etc/ca.pem|mark=100`
[upstreams.direct]
# Domestic/Direct DNS servers (UDP/TCP, IP or custom port). Supports per-upstream ca and mark.
servers = ["223.5.5.5|mark=50", "119.29.29.29"]
# Send queries to all direct-dns servers simultaneously
all = false
# Add resolved IPs of tag:direct domains to ipset/nftset (comma-separated sets)
sets = ["direct", "directv6"]
# Filter IPv6 rules (direct-dns won't resolve AAAA or filter ipset output)
no_ipv6 = false
# Filter specific DNS query types (e.g. 28 for AAAA) for this group
filter_qtype = []

[upstreams.proxy]
# Trusted/Proxy Upstream DNS (UDP/TCP/DoT/DoH/DoH3). Supports per-upstream ca and mark.
servers = [
    "tls://1.1.1.1:853|mark=100",
    "https://1.1.1.1/dns-query"
]
# Send queries to all proxy-dns servers simultaneously
all = false
# Add resolved IPs of tag:proxy domains to ipset/nftset (comma-separated sets)
sets = ["proxy", "proxyv6"]
# Filter IPv6 rules (proxy-dns won't resolve AAAA or filter ipset output)
no_ipv6 = true
# Filter specific DNS query types (e.g. 28 for AAAA) for this group
filter_qtype = [28]

[upstreams.fallback]
# Bootstrap DNS for resolving DoT/DoH hostnames in upstream URLs (IP literals only)
# Supports per-upstream socket marks as well.
# NOTE: no_ipv6 and filter_qtype are NOT available for fallback because it is a
# bootstrap resolver, not a routing tag. Filtering is only supported on routed groups.
servers = ["223.5.5.5|mark=150"]
# Send queries to all fallback-dns servers simultaneously
all = false

[upstreams.tuning]
# Number of duplicate queries to send to proxy DNS to mitigate packet loss
repeat_times = 1
# Set socket mark (SO_MARK) on outgoing UDP, TCP, and DoT packets globally (Linux only)
out_mark = 100
# Send queries to all custom group upstreams simultaneously by default
group_upstream_all = false

# Frequency in seconds for sending background active RTT probes (0 to disable)
# rtt_probe_interval = 15

# Timeout in milliseconds for background active RTT probe queries
# rtt_probe_timeout_ms = 2000

# Number of RTT samples for EMA calculation
# rtt_samples = 9

# Penalty in milliseconds added to RTT when an upstream fails or times out
# rtt_failure_penalty = 1000

# ==============================================================================
# 4. CUSTOM GROUPS
# ==============================================================================
# Define custom tags/groups here. Each table entry defines a group name.
# Up to 253 custom groups can be dynamically registered (expanded from 6).

[upstreams.groups.streaming]
# Outbound upstream DNS servers specifically for this group. Supports per-upstream ca and mark.
servers = ["https://dns.example/dns-query|ca=/etc/ssl/certs/ca-certificates.crt|mark=200"]
# Add resolved IPs of streaming group domains to ipset/nftsets
sets = ["streaming_set4", "streaming_set6"]
# Send queries to all group-upstream servers of this custom group simultaneously
all = false
# Filter IPv6 rules
no_ipv6 = false
# Filter specific DNS query types
filter_qtype = []

[upstreams.groups.work]
# Outbound upstream DNS servers for corporate network resolution
servers = ["10.0.0.1:53", "10.0.0.2:53"]
sets = ["work_set"]
all = true
no_ipv6 = false
filter_qtype = []



# ==============================================================================
# 6. RULE-BASED DNL ROUTING (Ordered Execution)
# ==============================================================================
# Rules are evaluated sequentially from top to bottom.
# Relative rule paths are automatically resolved relative to the configured workspace directory
# (or the directory containing this config file if no workspace is defined).

# Remote web-fetched rules (automatically downloaded to `path` and refreshed periodically in seconds)
# [[rules]]
# type = "upstream"
# path = "rules/gfw-remote.txt"
# url = "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt"
# refresh = 86400
# tag = "proxy"

[[rules]]
type = "upstream"
domains = [
    "DOMAIN,example.com",
    "DOMAIN-SUFFIX,google.com",
    "DOMAIN-KEYWORD,twitter",
    "github.com",
    "*.bing.com"
]
tag = "proxy"

[[rules]]
type = "upstream"
path = "rules/direct-provider.yaml"
tag = "direct"

[[rules]]
type = "upstream"
path = "rules/proxy-classical.rules"
tag = "proxy"

# Route specific domains using the custom "streaming" group defined above
[[rules]]
type = "upstream"
path = "rules/streaming-media.yaml"
tag = "streaming"

# Additional rule file routing specific domains to the custom "work" group
[[rules]]
type = "upstream"
path = "rules/corporate-domains.list"
tag = "work"

[[rules]]
type = "default"
tag = "direct"

# ==============================================================================
# 7. HOSTS & LOCAL OVERRIDES
# ==============================================================================
[hosts]
# Path to standard system hosts file
hosts_file = "/etc/hosts"

# Custom local resource records: name = ["ip1", "ip2"]
[hosts.rr_records]
"example.com" = ["1.2.3.4"]
"sub.example.com" = ["::1"]

# ==============================================================================
# 8. DNS CACHING
# ==============================================================================
[cache]
# DNS Cache Size (number of records, 0 to disable)
size = 4096

# Serve stale cache entries for this many seconds after TTL expiration
stale = 86400

# Trigger background refresh when elapsed TTL exceeds this percentage
refresh = 20

# TTL of NODATA responses (seconds)
nodata_ttl = 60

# Minimum and Maximum TTL overrides (seconds)
# min_ttl = 300
# max_ttl = 86400

# Ignore DNS cache for specific domains (suffix matching)
cache_ignore = ["apple.com"]

# Background cache cleanup interval (seconds, 0 to disable)
cleanup_interval = 600

# Cache database persistence path
db_path = "/var/cache/chinadns-rs/cache.db"

# ==============================================================================
# 9. SSL CERTIFICATE VALIDATION
# ==============================================================================
[ssl]
# Enable SSL certificate validation for encrypted upstreams
cert_verify = false

# Custom CA certificates path for SSL validation
ca_certs = "/etc/ssl/certs/ca-certificates.crt"

# ==============================================================================
# 10. IPSET / NFTSET INTEGRATION (Requires CAP_NET_ADMIN)
# ==============================================================================
[ipset]
# Disable adding IPs to the built-in set blacklist
no_ipset_blacklist = false

# ==============================================================================
# 11. RESOURCE LIMITS & SOCKET TUNING
# ==============================================================================
[limits]
# Upstream query timeout in milliseconds
timeout_ms = 1000

# Timeout for idle TCP client connections in milliseconds
tcp_idle_timeout_ms = 10000

# Timeout in milliseconds for waiting to acquire an internal query queue permit before dropping under saturation
queue_timeout_ms = 2000

# Number of Tokio worker threads (default: available CPU cores, or 1 on single-core / low-end)
# worker_threads = 2

# Tokio worker thread stack size in bytes (default: 524288 / 512KB for low-end / embedded devices)
# thread_stack_size = 524288

# Frequency in seconds for sending background active RTT probes (0 to disable)
# rtt_probe_interval = 15

# Timeout in milliseconds for background active RTT probe queries
# rtt_probe_timeout_ms = 2000

# Maximum number of concurrent queries processed globally
max_concurrent_queries = 1000

# Maximum number of accepted client connections (TCP/DoT/DoH/DoH3)
max_client_connections = 1024

# Maximum background refresh queries
max_background_refreshes = 256

# Maximum active connections per TCP/DoT/DoH upstream
max_upstream_conns = 16

# UDP socket send/receive buffer size in bytes
socket_buffer_size = 1048576

# Enable SO_REUSEPORT on listener sockets
reuse_port = false

# HTTP/3 & QUIC performance profile (options: "low", "balanced", "high")
#   - low:      Optimized for OpenWrt / embedded routers (32MB-64MB RAM). Keeps HTTP/3 memory < 2MB RSS.
#   - balanced: Default profile for home servers, NAS, and small VPS instances (128MB+ RAM).
#   - high:     High-throughput profile for cloud servers and high-concurrency deployments.
# h3_profile = "balanced"

# Enable ultra-low memory mode for HTTP/3 (shortcut for h3_profile = "low").
# h3_low_memory = false

# ==============================================================================
# 12. LOGGING & DIAGNOSTICS
# ==============================================================================
[logging]
# General log level (options: trace, debug, info, warn, error)
log_level = "info"

# Log DNS match results to a file (format: domain,Tag,Rule)
log_dns_match = "/var/log/chinadns-rs/match.log"

# Log DNS resolution results to a file
# log_dns_result = "/var/log/chinadns-rs/result.log"

# Log standard output/error to a specific file
# log_file = "/var/log/chinadns-rs/chinadns.log"

# Alternatively, write rolling log files to a directory
# log_dir = "/var/log/chinadns-rs/"

# Log rotation settings (when log_dir is used)
# log_rotation_period = "daily"  # Options: hourly, daily, never
# log_rotation_size = "10M"      # e.g., 10M, 100M
# log_max_files = 10

# Enable verbose debug output
verbose = false
