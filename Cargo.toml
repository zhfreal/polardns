[package]
name = "polardns"
version = "1.23.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A next-generation high-performance rule-based DNS proxy/router."
repository = "https://github.com/polardns/polardns"

[features]
default = [
    "jemalloc",
    "server-tls",
    "original-h3-server",
    "upstream-h3",
    "tls12",
    "ipset",
    "yaml",
    "regex",
    "aho-corasick",
    "hot-reload",
    "file-log",
]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
tls12 = ["rustls?/tls12"]
upstream-h3 = ["reqwest?/http3"]

# Synthetic internal feature grouping all Rustls ecosystem dependencies
rustls-stack = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:webpki-roots",
    "dep:reqwest",
    "dep:rustls-webpki",
    "dep:ring",
    "dep:futures",
]

original = ["rustls-stack", "dep:quinn", "dep:h3", "dep:h3-quinn"]
original-h3-server = ["original"]

boring = ["dep:boring", "dep:tokio-boring", "dep:boring-sys", "dep:foreign-types"]
quiche = ["dep:quiche", "dep:url", "boring", "dep:dashmap", "dep:lru", "dep:idna", "dep:arc-swap"]

# Local Encrypted Server Listeners
server-doh = ["hyper/server", "hyper-util/server", "hyper-util/server-auto"]
server-dot = [] # gate: no extra deps, only #[cfg] in source
server-h3 = [] # gate: no extra deps, only #[cfg] in source
server-tls = ["server-doh", "server-dot", "server-h3"]

# Optional Features
ipset = ["dep:ripset"]
yaml = ["dep:serde_yml"]
regex = ["dep:regex"]
aho-corasick = ["dep:aho-corasick"]
hot-reload = ["dep:notify"]
file-log = ["dep:tracing-rolling-file"]

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tower-service = "0.3"
clap = { version = "4.6.0", features = [
    "derive",
    "help",
    "usage",
    "error-context",
] }
aho-corasick = { version = "1.1", optional = true }
rand = "0.9"
ripset = { version = "0.1", optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "io-util",
    "signal",
    "fs",
] }
futures = { version = "0.3", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "std",
    "ansi",
    "env-filter",
    "registry",
] }
tracing-appender = "0.2.3"
tracing-rolling-file = { version = "0.1.2", optional = true }
notify = { version = "6.1.1", optional = true }
rustc-hash = "2.1.2"
compact_str = "0.9.0"

# Optional/Rustls stack dependencies
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
], optional = true }
tokio-rustls = { version = "0.26", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "h2",
    "socks",
    "stream",
], optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-webpki = { version = "0.103", optional = true }

# BoringSSL Stack dependencies
boring = { version = "4.0", default-features = false, optional = true }
boring-sys = { version = "4.0", optional = true }
tokio-boring = { version = "4.0", optional = true }
quiche = { version = "0.29.3", default-features = false, features = ["boringssl-boring-crate"], optional = true }
idna = { version = "1.0", optional = true }
arc-swap = { version = "1.7", optional = true }
foreign-types = { version = "0.5", optional = true }

# Hyper Stack with Client Features for BoringSSL HttpClient
hyper = { version = "1.9.0", default-features = false, features = ["http2"] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "tokio",
    "client",
    "client-legacy",
    "http1",
    "http2",
] }
http-body-util = "0.1.3"
base64 = "0.22"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
url = { version = "2", default-features = false, optional = true }
dashmap = { version = "6", default-features = false, optional = true }
lru = { version = "0.12", default-features = false, optional = true }
ring = { version = "0.17", optional = true }
socket2 = { version = "0.5", features = ["all"] }
regex = { version = "1.10", optional = true }
libc = "0.2"
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }
http = "1.4.1"
bytes = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_yml = { version = "0.0.12", optional = true }
indexmap = { version = "2", features = ["serde"] }
smallvec = "1.14"
itoa = "1.0"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_Ndis",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.release-min]
inherits = "release"
opt-level = "z"
