# Example polardns config file.
# Run with:
#   polardns --config /etc/polardns/config.conf
#
# Config syntax supports:
#   key value
#   key=value
#   repeated keys
#   comma-separated values for list options
#
# Use absolute paths when running from systemd or Docker.

# ==============================================================================
# 1. CORE & LISTENER SETTINGS
# ==============================================================================

# Workspace base directory for resolving relative paths (e.g. for rules, certificates, databases).
# Can also be set via POLARDNS_WORKSPACE env variable or -w / --workspace CLI flag.
# workspace /etc/polardns

# Custom User-Agent header string for HTTP requests (DoH, DoH3, Web rules)
# user-agent polardns/1.17.0

# Listener addresses. Repeat for multiple interfaces.
# Supports IP addresses (e.g. 127.0.0.1, ::1) or Unix Domain Sockets:
#   - unix:/path/to/socket      (Stream / TCP-like)
#   - unixgram:/path/to/socket  (Datagram / UDP-like)
bind-addr 127.0.0.1
bind-addr ::1
# bind-addr unix:/tmp/dns.sock

# Optional: Bind to specific network interfaces.
# interface lo,eth0

# Optional: Exclude specific network interfaces.
# (CLI equivalent: --except-interface)
# except-interface wlan*

# Optional: Statically bind to interfaces using SO_BINDTODEVICE.
# (CLI equivalent: -z / --bind-interfaces)
# bind-interfaces

# Optional: Dynamically bind individual sockets to interface IPs (dnsmasq style).
# (CLI equivalents: --bind-dynamic, --bind)
# bind-dynamic

# Standard DNS (UDP/TCP) listener ports.
# Supports multiple lines (repeated keys) or comma-separated lists.
bind-port 1054

# Specific listener endpoints. Unlike bind-addr + bind-port, listen specifies
# exact address:port pairs or Unix sockets and does not cross-multiply.
# Supports multiple lines (repeated keys) or comma-separated lists.
#   - listen 127.0.0.1:1053
#   - listen [::1]:1053
#   - listen unix:/tmp/dns.sock
#   - listen unixgram:/tmp/dns.sock
# listen 127.0.0.1:1053

# Optional: Listen on UDP only (disables local TCP listener).
# udp-only

# Disable binding to IPv6 Link-Local (fe80::/10) addresses globally.
# no-ipv6-link-local

# ==============================================================================
# 2. LOCAL DoT / DoH / DoH3 LISTENER SETTINGS
# ==============================================================================

# Bind TLS listeners to specific network interfaces (independent of plain DNS).
# tls-interface ppp0

# Exclude specific network interfaces for TLS listeners.
# (CLI equivalent: --tls-except-interface)
# tls-except-interface wlan*

# Statically bind TLS listeners to interfaces using SO_BINDTODEVICE.
# (CLI equivalent: --tls-bind-interfaces)
# tls-bind-interfaces

# Dynamically bind TLS individual sockets to interface IPs.
# (CLI equivalents: --tls-bind-dynamic, --tls-bind)
# tls-bind-dynamic

# Bind TLS listeners to specific addresses (independent of plain DNS).
# tls-bind-addr ::1

# Disable binding to IPv6 Link-Local (fe80::/10) addresses for TLS listeners.
# no-tls-ipv6-link-local

# Enable DNS-over-TLS (DoT) listener.
# enable-dot

# DoT listener ports. Supports multiple lines or comma-separated lists.
# dot-port 853

# Enable DNS-over-HTTPS (DoH) listener.
# enable-doh

# DoH listener ports. Supports multiple lines or comma-separated lists.
# doh-port 443

# DoH path for requests.
# doh-path /dns-query

# Enable DNS-over-HTTP/3 (DoH3 over QUIC). Requires enable-doh.
# enable-doh3

# Enable DNS-over-QUIC (DoQ) listener (RFC 9250).
# enable-doq

# DoQ listener ports. Supports multiple lines or comma-separated lists.
# doq-port 853

# Idle timeout for QUIC (DoH3 and DoQ) connections in milliseconds (default: 30000ms / 30s).
# quic-idle-timeout-ms 30000

# Path to TLS certificate chain file (PEM).
# cert-file /etc/polardns/tls/default.crt

# Path to TLS private key file (PEM).
# key-file /etc/polardns/tls/default.key

# Additional TLS certificate/key pairs for different domains.
# Repeat for multiple pairs, or pass a comma/semicolon-separated value.
# cert-pair cert1.pem,key1.pem
# cert-pair cert2.pem,key2.pem

# Reject TLS handshakes if the client's SNI does not match any certificate.
# strict-sni

# Allow TLS 1.2 for local DoT/DoH TCP listeners (TLS 1.3 is default).
# Requires binary compiled with feature `tls12`.
# enable-tls12

# ==============================================================================
# 3. UPSTREAM DNS CONFIGURATION
# ==============================================================================

# Direct DNS servers (e.g. direct/local). Supports comma-separated IPs/URLs.
# Supports custom ports and protocol prefixes:
#   - udp://127.0.0.1:1053      (UDP only on custom port)
#   - tcp://127.0.0.1:1053      (TCP only on custom port)
#   - 127.0.0.1:1053            (Both UDP and TCP on custom port)
#   - 223.5.5.5                 (Defaults to UDP/TCP on port 53)
direct-dns 223.5.5.5,119.29.29.29

# Send queries to all configured direct-dns servers simultaneously.
# direct-dns-all

# Trusted Upstream DNS (e.g. proxy/trust). Supports UDP/TCP/DoT/DoH/DoH3.
# Supports custom ports and protocol prefixes:
#   - udp://8.8.8.8:53, tcp://8.8.4.4:53
#   - tls://1.1.1.1:853          (DNS-over-TLS)
#   - https://1.1.1.1/dns-query  (DNS-over-HTTPS)
#   - h3://1.1.1.1/dns-query     (DNS-over-HTTP/3)
#   - tls://dns1.example.com:853|ca=/etc/polardns/ca-dns1.pem (DoT with custom root CA)
#   - https://dns2.example.com/dns-query|ca=/etc/polardns/ca-dns2.pem (DoH with custom root CA)
#   - tls://dns1.example.com:853|mark=100 (DoT with socket mark 100)
#   - udp://8.8.8.8:53|mark=200            (UDP with socket mark 200)
# Note: Programmatic socket marking (|mark=val) is supported for UDP, TCP, and DoT.
# Due to library limitations, it is not supported for DoH/DoH3 (https:// or h3://).
# To route DoH/DoH3 traffic, run polardns inside a Linux cgroup and use:
#   nft add rule ip filter output socket cgroup "polardns" meta mark set 100
proxy-dns tls://1.1.1.1:853,https://1.1.1.1/dns-query

# Send queries to all configured proxy-dns servers simultaneously.
# proxy-dns-all

# Bootstrap DNS for resolving DoT/DoH hostnames in upstream URLs.
# Supports IP literals, udp://IP, or tcp://IP only.
fallback-dns 223.5.5.5

# Send queries to all configured fallback-dns servers simultaneously.
# fallback-dns-all

# Number of duplicate packets to send to trustdns/proxy-dns (reduces packet loss impact).
# repeat-times 1

# Set socket mark (SO_MARK) on all outgoing UDP, TCP, and DoT packets (Linux only).
# out-mark 100

# ==============================================================================
# 4. RULE-BASED DNL ROUTING
# ==============================================================================

# Adblock Domain list file(s). Checked first. Matches are tagged as 'adblock'.
# adblock /etc/polardns/rules/adblock-provider.yaml

# Upstream routing rules.
# You can specify upstream-rule multiple times. It accepts either:
# A) A separate rules file path (compatibility mode):
#    upstream-rule /etc/polardns/upstreams.rules
# B) Inline rules directly (maps domain list file to tag):
#    upstream-rule /etc/polardns/rules/direct-provider.yaml@direct
#    upstream-rule /etc/polardns/rules/proxy-classical.rules@proxy
upstream-rule /etc/polardns/upstreams.rules

# Default tag for unmatched domains (e.g. direct, proxy).
default-tag direct

# ==============================================================================
# 5. CUSTOM GROUPS
# ==============================================================================

# Custom routing group definition(s). Create with --group name.
# group streaming

# Custom Group Upstream Servers. Syntax: group_name:upstream_address
# group-upstream streaming:https://dns.example/dns-query

# Send queries to all group-upstream servers of a group simultaneously.
# group-upstream-all

# ==============================================================================
# 6. ROUTING TWEAKS & FILTERING
# ==============================================================================

# Filter IPv6 rules (e.g., direct-dns won't resolve AAAA or filter ipset output).
# Syntax: tag:name, or no-ipv6 true (global)
# no-ipv6 tag:proxy

# Filter specific DNS query types (e.g. 28 for AAAA). Repeat to filter multiple.
# filter-qtype 28

# Allow empty IP reply from direct-dns to fallback to proxy tag (legacy tag:none behavior).
# noip-as-chnip

# ==============================================================================
# 7. HOSTS & LOCAL OVERRIDES
# ==============================================================================

# Load standard hosts file.
# hosts /etc/hosts

# Add custom local resource records. Format: name1=ip1,ip2;name2=ip3
# dns-rr-ip example.com=1.2.3.4
# dns-rr-ip sub.example.com=::1

# ==============================================================================
# 8. DNS & VERDICT CACHING
# ==============================================================================

# DNS Cache Size (number of records, 0 to disable).
cache 4096

# Stale Cache limits (seconds). Serve stale entries while updating in background.
cache-stale 86400

# Cache refresh threshold (percentage of TTL).
cache-refresh 20

# TTL of NODATA responses (seconds).
cache-nodata-ttl 60

# Minimum cache TTL override.
# cache-min-ttl 300

# Maximum cache TTL override.
# cache-max-ttl 86400

# Ignore dns cache for specific domains (suffix).
# cache-ignore apple.com

# Background cache cleanup interval (seconds, 0 to disable).
cache-cleanup-interval 600

# Cache database persistence path.
cache-db /var/cache/polardns/cache.db

# Enable verdict caching for tag:none domains (size of cache).
# verdict-cache 4096

# Verdict Cache persistence path.
# verdict-cache-db /var/cache/polardns/verdict.db

# ==============================================================================
# 9. SSL CERTIFICATE VALIDATION
# ==============================================================================

# Enable SSL certificate validation for encrypted upstreams.
# By default, SSL validation is disabled, meaning self-signed or unverified
# certificates are accepted (useful for private or testing upstreams).
# cert-verify

# CA certs path for SSL validation. Used when cert-verify is enabled.
# ca-certs /etc/ssl/certs/ca-certificates.crt

# ==============================================================================
# 10. IPSET / NFTSET INTEGRATION (Requires CAP_NET_ADMIN)
# ==============================================================================

# Add the IP of resolved tag:direct domains to ipset/nftset (comma-separated list of sets).
# direct-sets direct,directv6

# Add the IP of resolved tag:proxy domains to ipset/nftset (comma-separated list of sets).
# proxy-sets proxy,proxyv6

# Add the IP of custom tag group domains to ipset/nftset (syntax: group:set4,set6).
# group-sets streaming:streaming_ipset,streaming_ipset6

# Disable adding IPs to the built-in set blacklist.
# no-ipset-blacklist

# ==============================================================================
# 11. RESOURCE LIMITS & SOCKET TUNING
# ==============================================================================

# Timeout for upstream servers in milliseconds.
timeout-ms 1000

# Timeout for idle TCP client connections in milliseconds.
tcp-idle-timeout-ms 10000

# Maximum number of concurrent queries the server will process globally.
max-concurrent-queries 1000

# Maximum number of accepted TCP/DoT/DoH/DoH3 client connections.
max-client-connections 1024

# Maximum number of cache refresh queries running in the background.
max-background-refreshes 256

# Maximum number of active connections per TCP/DoT/DoH upstream.
max-upstream-conns 16

# UDP socket send/receive buffer size in bytes.
socket-buffer-size 1048576

# Enable SO_REUSEPORT.
# reuse-port

# HTTP/3 & QUIC performance profile (options: low, balanced, high)
#   - low:      Optimized for OpenWrt / embedded routers (32MB-64MB RAM). Keeps HTTP/3 memory < 2MB RSS.
#   - balanced: Default profile for home servers, NAS, and small VPS instances (128MB+ RAM).
#   - high:     High-throughput profile for cloud servers and high-concurrency deployments.
# h3-profile balanced

# Enable ultra-low memory mode for HTTP/3 (shortcut for h3-profile low).
# h3-low-memory

# ==============================================================================
# 12. LOGGING & DIAGNOSTICS
# ==============================================================================

# General log level (options: trace, debug, info, warn, error).
# log-level info

# Log DNS match results to a file (format: domain,Tag,Rule).
# Send SIGHUP to reopen this file after log rotation.
log-dns-match /var/log/polardns/match.log

# Log DNS resolution results to a file.
# log-dns-result /var/log/polardns/result.log

# Log standard output/error to a specific file.
# log-file /var/log/polardns/polardns.log

# Alternatively, write rolling log files to a directory.
# log-dir /var/log/polardns/

# Log rotation settings (when log-dir is used).
# log-rotation-period daily
# log-rotation-size 10M
# log-max-files 10

# Enable verbose logging (trace debug).
# verbose
